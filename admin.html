<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CAM Holdings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <script>
        const token = localStorage.getItem('adminToken');
        if(!token) window.location.href = '/login.html';
    </script>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

    <aside class="sidebar">
        <div class="sidebar-header logo"><a href="index.html" target="_blank"><img src="assets/img/logo/logo3.png" alt="CAM Holdings" style="max-width: 140px;"></a></div>
        <ul class="nav-links">
            <li><div class="nav-link active" onclick="switchSection('apartments', this)"><i class="fa-solid fa-cloud-arrow-up"></i> Add Listing</div></li>
            <li><div class="nav-link" onclick="switchSection('manage-props', this); loadPropertiesTable();"><i class="fa-solid fa-list-check"></i> Manage Properties</div></li>
            <li><div class="nav-link" onclick="switchSection('users', this)"><i class="fa-solid fa-users-gear"></i> Manage Admins</div></li>
            <li><a href="index.html" class="nav-link" target="_blank"><i class="fa-solid fa-globe"></i> Live Site</a></li>
        </ul>
        <div class="logout-btn" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title" id="topbarTitle">Publish Listing</div>
            <div class="user-profile"><i class="fa-solid fa-shield-halved fa-2x"></i> <span>Admin Access</span></div>
        </header>

        <!-- Section: Add Apartment -->
        <div class="dashboard-container dashboard-section active" id="section-apartments">
            <div class="card">
                <div class="card-title">List New Apartment</div>
                <form id="apartmentForm" enctype="multipart/form-data">
                    <div class="form-grid">
                        <div class="form-group full-width"><label>Apartment Title <span style="color:red">*</span></label><input type="text" name="title" required placeholder="Ex: Luxury Oceanfront Suite"></div>
                        <div class="form-group"><label>Price (LKR) <span style="color:red">*</span></label><input type="number" name="price" required placeholder="0.00" min="0"></div>
                        <div class="form-group"><label>Location <span style="color:red">*</span></label><input type="text" name="location" required placeholder="Ex: Colombo 03"></div>
                        <div class="form-group"><label>Bedrooms</label><input type="number" name="bedrooms" placeholder="3" min="0"></div>
                        <div class="form-group"><label>Bathrooms</label><input type="number" name="bathrooms" placeholder="2" min="0"></div>
                        <div class="form-group"><label>Area (Sq Ft)</label><input type="number" name="area_sqft" placeholder="1500" min="0"></div>
                        <div class="form-group">
                            <label>Listing Type</label>
                            <select name="status"><option value="For Sale">For Sale</option><option value="For Rent">For Rent</option></select>
                        </div>
                        <div class="form-group">
                            <label>Active Status</label>
                            <select name="availability_status"><option value="Available">Available</option><option value="Sold">Sold / Occupied</option></select>
                        </div>
                        <div class="form-group full-width">
                            <label>Apartment Complex</label>
                            <select name="complex_name">
                                <option value="">-- No Complex --</option>
                                <option value="Trizen">Trizen</option><option value="Twin Peak">Twin Peak</option>
                                <option value="Cinnamon Life">Cinnamon Life</option><option value="Hilton">Hilton Residences</option>
                                <option value="Shangri-La">Shangri-La One Galle Face</option>
                            </select>
                        </div>
                        <div class="form-group full-width"><label>About The Property</label><textarea name="description" placeholder="Brief summary for the property card..." rows="3"></textarea></div>
                        <div class="form-group full-width"><label>Detailed Description</label><textarea name="detailed_description" placeholder="Expanded details for single property page..." rows="5"></textarea></div>
                        <div class="form-group full-width"><label>Neighborhood Info</label><textarea name="neighborhood_info" placeholder="Information about the location and surroundings..." rows="4"></textarea></div>
                        <div class="form-group full-width"><label>Property Images (Max 5) <span style="color:red">*</span></label><input type="file" name="images" accept="image/*" multiple required></div>
                        <div class="form-group full-width" style="margin-top: 1rem;"><button type="submit" class="btn-primary"><i class="fa-solid fa-cloud-arrow-up"></i> Publish Listing</button></div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Section: Manage Properties -->
        <div class="dashboard-container dashboard-section" id="section-manage-props">
            <div class="card" style="padding: 2rem;">
                <div class="card-title">Manage Listed Properties</div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="propertiesTableBody">
                            <tr><td colspan="5" style="text-align:center;">Loading properties...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Section: Manage Users -->
        <div class="dashboard-container dashboard-section" id="section-users">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="card-title">Create New Admin</div>
                <form id="adminForm">
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="form-group full-width"><label>Admin Email</label><input type="email" id="adminEmail" required placeholder="colleague@example.com"></div>
                        <div class="form-group full-width"><label>Password</label><input type="password" id="adminPass" required placeholder="Secure password"></div>
                        <div class="form-group full-width" style="margin-top: 1.5rem;"><button type="submit" class="btn-primary" style="width: 100%;"><i class="fa-solid fa-user-plus"></i> Grant Access</button></div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
            <div class="card-title">Edit Property</div>
            <form id="editForm" enctype="multipart/form-data">
                <input type="hidden" id="editId" name="id">
                <div class="form-grid">
                    <div class="form-group full-width"><label>Title</label><input type="text" id="editTitle" name="title" required></div>
                    <div class="form-group"><label>Price (LKR)</label><input type="number" id="editPrice" name="price" required></div>
                    <div class="form-group"><label>Location</label><input type="text" id="editLocation" name="location" required></div>
                    <div class="form-group">
                        <label>Availability</label>
                        <select id="editAvail" name="availability_status"><option value="Available">Available</option><option value="Sold">Sold / Occupied</option></select>
                    </div>
                    <div class="form-group">
                        <label>Complex Name</label>
                        <select id="editComplex" name="complex_name">
                            <option value="">-- No Complex --</option>
                            <option value="Trizen">Trizen</option><option value="Twin Peak">Twin Peak</option>
                            <option value="Cinnamon Life">Cinnamon Life</option><option value="Hilton">Hilton Residences</option>
                            <option value="Shangri-La">Shangri-La One Galle Face</option>
                        </select>
                    </div>
                    <div class="form-group full-width"><label>About The Property</label><textarea id="editAbout" name="description" rows="3"></textarea></div>
                    <div class="form-group full-width"><label>Detailed Description</label><textarea id="editDetailed" name="detailed_description" rows="5"></textarea></div>
                    <div class="form-group full-width"><label>Neighborhood Info</label><textarea id="editNeighborhood" name="neighborhood_info" rows="4"></textarea></div>
                    <div class="form-group full-width"><label>Update Images (Max 5) (Optional)</label><input type="file" name="images" accept="image/*" multiple></div>
                    <div class="form-group full-width"><button type="submit" class="btn-primary" style="width:100%"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button></div>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification"><i class="fa-solid fa-circle-check notification-icon"></i><span id="toastMsg">Success</span></div>

    <!-- Logic -->
    <script>
        const loader = document.getElementById('loadingOverlay');
        const notification = document.getElementById('notification');
        const toastMsg = document.getElementById('toastMsg');
        
        let allProperties = [];

        // --- Session Management & Auto Logout ---
        let inactivityTimer;
        const TIMEOUT_MS = 30 * 60 * 1000; // 30 minutes

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                showToast("Session expired due to inactivity. Signing out...", "error");
                setTimeout(logout, 2000);
            }, TIMEOUT_MS);
        }

        // Listen for user activity
        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, resetInactivityTimer, true);
        });
        resetInactivityTimer();

        // Optional: Periodic check for token validity
        setInterval(() => {
            if (token) {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    if (Date.now() >= payload.exp * 1000) {
                        logout();
                    }
                } catch (e) { logout(); }
            }
        }, 60000); // Check every minute

        function showToast(message, type = 'success') {
            toastMsg.textContent = message;
            notification.className = type === 'error' ? 'error show' : 'success show';
            setTimeout(() => notification.classList.remove('show'), 3500);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/login.html';
        }

        function switchSection(sectionName, navEl) {
            document.querySelectorAll('.dashboard-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById('section-' + sectionName).classList.add('active');
            navEl.classList.add('active');
            
            const titles = { apartments: 'Publish Listing', 'manage-props': 'Manage Properties', users: 'Manage Admins' };
            document.getElementById('topbarTitle').innerText = titles[sectionName];
        }

        async function loadPropertiesTable() {
            const tbody = document.getElementById('propertiesTableBody');
            try {
                const res = await fetch('/api/apartments');
                allProperties = await res.json();
                tbody.innerHTML = '';
                if(allProperties.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No properties listed yet.</td></tr>';
                    return;
                }
                allProperties.forEach(apt => {
                    const badgeClass = apt.availability_status === 'Available' ? 'badge available' : 'badge sold';
                    const img = apt.image_url ? `/${apt.image_url}` : 'assets/img/all-images/features-img3.png';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="td-img"><img src="${img}"></td>
                        <td style="font-weight: 500;">${apt.title}</td>
                        <td>$${Number(apt.price).toLocaleString()}</td>
                        <td><span class="${badgeClass}">${apt.availability_status || 'Available'}</span></td>
                        <td>
                            <button class="btn-small btn-edit" onclick="openEditModal(${apt.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-small btn-delete" onclick="deleteProperty(${apt.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;">Failed to load properties.</td></tr>';
            }
        }

        function openEditModal(id) {
            const apt = allProperties.find(a => a.id === id);
            if(!apt) return;
            document.getElementById('editId').value = apt.id;
            document.getElementById('editTitle').value = apt.title;
            document.getElementById('editPrice').value = apt.price;
            document.getElementById('editLocation').value = apt.location;
            document.getElementById('editAvail').value = apt.availability_status || 'Available';
            document.getElementById('editComplex').value = apt.complex_name || '';
            document.getElementById('editAbout').value = apt.description || '';
            document.getElementById('editDetailed').value = apt.detailed_description || '';
            document.getElementById('editNeighborhood').value = apt.neighborhood_info || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            document.getElementById('editForm').reset();
        }

        async function deleteProperty(id) {
            if(!confirm("Are you sure you want to delete this property?")) return;
            loader.classList.add('active');
            try {
                const res = await fetch('/api/apartments/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if(res.ok) {
                    showToast("Property deleted!");
                    loadPropertiesTable();
                } else if(res.status === 401 || res.status === 403) logout();
            } catch(e) { showToast("Failed to delete", "error"); }
            loader.classList.remove('active');
        }

            document.getElementById('editForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            loader.classList.add('active');
            
            const fileInput = e.target.querySelector('input[type="file"]');
            if (fileInput && fileInput.files.length > 5) {
                loader.classList.remove('active');
                return showToast("You can only upload up to 5 images.", "error");
            }
            
            const id = document.getElementById('editId').value;
            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/apartments/' + id, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                if(res.ok) {
                    showToast("Property updated successfully!");
                    closeModal();
                    loadPropertiesTable();
                } else if(res.status === 401 || res.status === 403) logout();
            } catch(e) { showToast("Update failed", "error"); }
            loader.classList.remove('active');
        });

        document.getElementById('apartmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            loader.classList.add('active');
            
            const fileInput = e.target.querySelector('input[type="file"]');
            if (fileInput && fileInput.files.length > 5) {
                loader.classList.remove('active');
                return showToast("You can only upload up to 5 images.", "error");
            }

            const formData = new FormData(e.target);
            try {
                const response = await fetch('/api/apartments', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                if(response.ok) {
                    showToast("Apartment listed successfully!");
                    e.target.reset();
                } else if(response.status === 401 || response.status === 403) logout();
            } catch (err) { showToast("Server error.", 'error'); }
            loader.classList.remove('active');
        });

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            loader.classList.add('active');
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPass').value;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ email, password })
                });
                if(response.ok) {
                    showToast("New Admin account created!");
                    e.target.reset();
                } else if(response.status === 401 || response.status === 403) logout();
            } catch (err) { showToast("Server error.", 'error'); }
            loader.classList.remove('active');
        });
    </script>
</body>
</html>
