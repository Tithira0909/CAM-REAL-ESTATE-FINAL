<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CAM Holdings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <h2>CAM <span>Admin</span></h2>
                <p>Sign in to manage your real estate portfolio</p>
            </div>

            <!-- Login Form (Step 1) -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" class="form-control" name="email" required placeholder="admin@example.com">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-control" name="password" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <div class="spinner"></div>
                </button>
                <div class="error-message" id="loginError"></div>
            </form>

            <!-- OTP Form (Step 2) -->
            <form id="otpForm" class="otp-section">
                <div class="form-group">
                    <div id="qrInfo" class="qr-setup-info">
                        <strong>New Device?</strong><br>
                        Scan this QR code with Google Authenticator or any TOTP app to set up your 2FA.
                    </div>
                    
                    <div id="qrContainer" class="qr-container">
                        <img id="qrImage" src="" alt="QR Code">
                    </div>

                    <label id="otpLabel" style="text-align: center; margin-bottom: 1rem;">Enter the 6-digit code from your Authenticator app.</label>
                    <div class="otp-inputs" id="otpContainer">
                        <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
                        <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
                        <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
                        <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
                        <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
                        <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, event)">
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="otpBtn">
                    <span class="btn-text">Verify Code</span>
                    <div class="spinner"></div>
                </button>
                <div class="error-message" id="otpError"></div>
                <div style="text-align: center; margin-top: 1rem;">
                    <a href="javascript:void(0)" onclick="location.reload()" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">Go back</a>
                </div>
            </form>

        </div>
    </div>

    <!-- Logic -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        const otpForm = document.getElementById('otpForm');
        const otpBtn = document.getElementById('otpBtn');
        const otpError = document.getElementById('otpError');
        const otpContainer = document.getElementById('otpContainer');
        const otpInputs = otpContainer.querySelectorAll('.otp-input');

        let storedEmail = "";

        // OTP input navigation logic
        function moveToNext(elem, event) {
            const index = Array.from(otpInputs).indexOf(elem);
            if(elem.value.length === 1 && index < 5) {
                otpInputs[index + 1].focus();
            }
            if(event.key === 'Backspace' && index > 0 && elem.value === '') {
                otpInputs[index - 1].focus();
            }
        }

        // Handle Login Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = "";
            loginBtn.classList.add('loading');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                
                if(!res.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Success! Transition to Step 2
                storedEmail = email;
                
                // If first-time setup
                if (data.setupRequired) {
                    document.getElementById('qrImage').src = data.qrCode;
                    document.getElementById('qrContainer').style.display = 'block';
                    document.getElementById('qrInfo').style.display = 'block';
                    document.getElementById('otpLabel').innerHTML = "<strong>Step 2:</strong> Enter the token from your new app entry.";
                }

                loginForm.style.display = 'none';
                otpForm.style.display = 'block';
                otpInputs[0].focus();

            } catch(err) {
                loginError.textContent = err.message;
            } finally {
                loginBtn.classList.remove('loading');
            }
        });

        // Handle OTP Submission
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            otpError.textContent = "";

            let tokenValue = "";
            otpInputs.forEach(input => tokenValue += input.value);

            if(tokenValue.length !== 6) {
                otpError.textContent = "Please enter all 6 digits.";
                return;
            }

            otpBtn.classList.add('loading');

            try {
                const res = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: storedEmail, token: tokenValue })
                });

                const data = await res.json();

                if(!res.ok) {
                    throw new Error(data.error || 'Verification failed');
                }

                // Verification successful
                localStorage.setItem('adminToken', data.token);
                window.location.href = '/admin.html'; // Redirect to dashboard

            } catch(err) {
                otpError.textContent = err.message;
            } finally {
                otpBtn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
